
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎓 University Finder</h1>
    <p>Discover universities around the world</p>
  </header>

  <main class="container">
    <div class="search-box">
      <input
        type="text"
        id="countryInput"
        placeholder="Enter country (e.g. India)"
      >
      <button id="searchBtn">Search</button>
    </div>

    <p id="status" aria-live="polite">
      Enter a country to find universities.
    </p>

    <h2 id="resultHeading"></h2>
    <section id="universityList" class="university-list"></section>
  </main>

  <footer>
    <p>University data provided by the Hipolabs Universities API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
