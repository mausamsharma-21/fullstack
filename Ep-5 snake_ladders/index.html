
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Snake and Ladder Game</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <h1>🐍 Snake and Ladder 🎲</h1>

        <div class="game-info">
            <h2 id="turn">Player 1's Turn</h2>
            <p id="message">Roll the dice to start!</p>
        </div>

        <div id="board"></div>

        <div class="controls">

            <div id="dice">🎲</div>

            <button id="rollBtn">
                Roll Dice
            </button>

            <button id="restartBtn">
                Restart Game
            </button>

        </div>

        <div class="player-info">
            <p>🔴 Player 1: <span id="p1">1</span></p>
            <p>🔵 Player 2: <span id="p2">1</span></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
